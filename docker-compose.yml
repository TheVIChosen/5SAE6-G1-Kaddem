version: '3.8'

services:
  mysql-container:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 0000
      MYSQL_DATABASE: kaddemdb
    networks:
      - kaddem-network
      - monitoring_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      
  sonarqube:
    image: sonarqube:latest
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:mysql://localhost:3306/kaddemdb?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      - SONAR_JDBC_USERNAME=root
      - SONAR_JDBC_PASSWORD=0000

  nexus:
    image: sonatype/nexus3:latest
    restart: unless-stopped
    ports:
      - "8082:8081"
    volumes:
      - ./nexus-data:/nexus-data

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"  # Accessible on http://10.0.2.15:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-storage:/var/lib/grafana
    network_mode: "host"  # Ensures Grafana binds to the host IP

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"  # Accessible on http://10.0.2.15:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: "host"

  kaddem-app:
    image: naderouali/kaddem:latest
    depends_on:
      - mysql-container  # Ensure MySQL starts first
    networks:
      - monitoring_network  # Keep using the monitoring network
      - kaddem-network
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prometheus
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-container:3306/kaddemdb?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=0000

volumes:
  grafana-storage:

networks:
  monitoring_network:
    driver: bridge
  kaddem-network:
    driver: bridge
