version: "3.8"
services:
  mysql-db:
    image: mysql:5.7
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=kaddemdb
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
  kaddem-app:
    image: chouknassim_g1_kaddem
    depends_on:
      - mysql-db
    restart: on-failure
    environment:
      SPRING_APPLICATION_JSON: '{
         "spring.datasource.url": "jdbc:mysql://mysql-db:3306/kaddemdb?allowPublicKeyRetrieval=true&useSSL=false",
        "spring.datasource.username": "root",
        "spring.datasource.password": "",
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQL5Dialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    ports:
      - "8089:8089"
volumes:
  db-data: